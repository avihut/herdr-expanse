EAM RELAY</text><text x="28" y="479" fill="#75d7e7" font-size="11">3D WALKAROUND</text><text x="28" y="525" fill="#75d7e7" font-size="11">CONSOLE PREFERENCES</text><text x="28" y="571" fill="#75d7e7" font-size="11">ROCI    UNN    BELT</text><rect x="302" y="99" width="886" height="34" fill="#14232c" /><text x="314" y="121" fill="#cce4e7" font-size="12">01 / navigation    02 / review                                   + LAUNCH   PLANS</text><rect x="302" y="141" width="886" height="592" fill="#09131e" stroke="#315663"/><rect x="303" y="142" width="884" height="28" fill="#14232c" /><text x="316" y="161" fill="#cce4e7" font-size="11">CONSOLE / demo terminal                                      demo/crew-1    ⋯  ↗</text><text x="326" y="207" fill="#cce4e7" font-size="16">$ flight-deck --demo</text><text x="326" y="242" fill="#cce4e7" font-size="17">Your terminals remain the main work surface.</text><text x="326" y="274" fill="#91b0b7" font-size="14">Real spaces · real agents · real machine readiness</text><text x="326" y="305" fill="#91b0b7" font-size="14">No invented reactor readings or work progress.</text><rect x="460" y="380" width="670" height="285" fill="#14232c" stroke="#315663"/><text x="485" y="419" fill="#75d7e7" font-size="17">OFF WATCH / TRAINING LIBRARY</text><text x="485" y="465" fill="#edc476" font-size="24">FLIP &amp; BURN</text><text x="485" y="494" fill="#cce4e7" font-size="14">Manage momentum. Arrive with zero velocity.</text><text x="485" y="553" fill="#edc476" font-size="24">TIGHT-BEAM RELAY</text><text x="485" y="582" fill="#cce4e7" font-size="14">Rotate. Authenticate all 16 relays. Transmit.</text><rect x="12" y="744" width="1176" height="24" fill="#14232c" /><text x="23" y="760" fill="#75d7e7" font-size="10">LOCAL LINK: HOST-MEASURED IN APP</text><text x="580" y="760" fill="#91b0b7" font-size="10">ORIGINAL SYNTHETIC ILLUSTRATION · NOT A LIVE SCREENSHOT</text></svg>